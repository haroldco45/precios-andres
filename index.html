<style>
:root{--navy:#0f1b3d;--navy2:#1d2f6b;--coral:#ff5a5f;--mint:#19c39c;--amber:#ffb020;--bg:#f3f5fb;--card:#fff;--ink:#16203a;--mute:#6b7592;--line:#e4e8f3}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:Outfit,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input{font:inherit}
header{position:relative;overflow:hidden;color:#fff;padding:calc(18px + env(safe-area-inset-top)) 18px 22px;
  background:linear-gradient(120deg,var(--navy),var(--navy2),#3b2a7a,var(--navy));background-size:300% 300%;animation:flow 14s ease infinite}
header::before,header::after{content:"";position:absolute;border-radius:50%;filter:blur(40px);opacity:.55;animation:float 9s ease-in-out infinite}
header::before{width:220px;height:220px;background:var(--coral);top:-90px;right:-60px}
header::after{width:180px;height:180px;background:var(--mint);bottom:-110px;left:-40px;animation-delay:-4s}
@keyframes flow{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(-20px,15px)}}
.top{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand small{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.75}
.brand h1{font-size:24px;font-weight:800;line-height:1.1}
.pill{border:1px solid rgba(255,255,255,.35);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;background:rgba(255,255,255,.08)}
.hero{position:relative;z-index:1;margin-top:14px;display:flex;gap:10px;flex-wrap:wrap}
.btn{border-radius:14px;padding:12px 16px;font-weight:600;font-size:15px}
.btn-main{background:var(--coral);color:#fff;box-shadow:0 8px 20px rgba(255,90,95,.35)}
.btn-ghost{background:rgba(255,255,255,.14);color:#fff}
.btn-main:active,.btn-ghost:active{transform:scale(.97)}
.meta{position:relative;z-index:1;margin-top:12px;font-size:13px;opacity:.85}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:14px 16px 4px;scrollbar-width:none}

.tab{white-space:nowrap;padding:9px 16px;border-radius:12px;background:#fff;border:1px solid var(--line);font-weight:600;font-size:14px;color:var(--mute)}
.tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}

.stat{background:#fff;border-radius:16px;padding:12px;border:1px solid var(--line)}
.stat b{display:block;font-size:22px;font-weight:800}
.stat span{font-size:12px;color:var(--mute)}
.stat.hot b{color:var(--coral)}
.searchbar{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 80%,transparent);padding:8px 16px 10px}
.search{width:100%;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:#fff;font-size:16px;outline:none}
.search:focus{border-color:var(--navy2);box-shadow:0 0 0 3px rgba(29,47,107,.12)}
.chips{display:flex;gap:6px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:7px 12px;border-radius:99px;font-size:13px;font-weight:500;background:#e9edf7;color:var(--ink)}
.chip.on{background:var(--ink);color:#fff}
.chip.alert{background:#ffe9ea;color:#c4373b}
.chip.alert.on{background:var(--coral);color:#fff}
main{padding:0 16px 120px}
.cat{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:16px 4px 8px;font-weight:600}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:14px;margin-bottom:8px;border:1px solid var(--line);

.item.chg{border-left:4px solid var(--coral)}
.item.new{border-left:4px solid var(--mint)}

.row{display:flex;gap:8px}
.row .btn{flex:1}
.btn-dark{background:var(--navy);color:#fff}
.btn-soft{background:#e9edf7;color:var(--ink)}
.btn-wa{background:#1fb35a;color:#fff}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--mute);margin-bottom:6px;font-weight:500}
.field input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font-size:16px}
.hint{font-size:12px;color:var(--mute);margin-top:6px;line-height:1.4}
.qline{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.qline .q{display:flex;gap:6px;align-items:center}
.qline .q button{width:30px;height:30px;border-radius:9px;background:#e9edf7;font-weight:800}
.qtotal{display:flex;justify-content:space-between;font-size:20px;font-weight:800;margin:14px 0}
.danger{color:#c4373b;font-weight:600;margin-top:10px;padding:8px 0}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%) translateY(-120px);z-index:50;background:var(--ink);color:#fff;
  padding:12px 18px;border-radius:14px;font-size:14px;max-width:90vw;transition:transform .3s;box-shadow:0 10px 25px rgba(0,0,0,.25)}
.toast.show{transform:translateX(-50%) translateY(0)}
footer{text-align:center;font-size:12px;color:var(--mute);padding:10px 0 30px}
footer a{color:var(--navy2);font-weight:600;text-decoration:none}
</style>

<script>
/* Precios al Día — Vibras Positivas HM */
const $=s=>document.querySelector(s);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};

let lang=LS.get('pl_lang','es');
let data=LS.get('pl_data',null);          // {sheets:{nombre:[items]}, order:[], file, loadedAt}
let cfg=LS.get('pl_cfg',{name:'',wa:'',url:''});
let cart=LS.get('pl_cart',{});            // "hoja|clave" -> cantidad
const st={sheet:data?.order?.[0]||null,q:'',cat:'',onlyChg:false};

const T={
 es:{app:'Precios al Día',title:'Negocios de Andrés',open:'Abrir planilla',update:'Actualizar',settings:'Ajustes',search:'Buscar producto o código…',all:'Todo',changes:'Cambios',
  products:'productos',changed:'cambiaron',newp:'nuevos',loaded:'Planilla del',file:'Archivo',

  seeQuote:'Ver cotización',quote:'Cotización',items:'productos en la cotización',send:'Enviar por WhatsApp',empty:'Vaciar',add:'Agregar a la cotización',remove:'Quitar',close:'Cerrar',qty:'Cantidad',total:'Total',
  bizName:'Nombre del negocio',ownerWa:'WhatsApp para enviar cotizaciones (opcional)',waHint:'Con indicativo, ej. 573001234567. Si lo deja vacío, WhatsApp le pregunta a quién enviarla.',

};
const t=k=>T[lang][k]??k;
const money=v=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:v%1?2:0}).format(v);
const fmtDate=ms=>new Intl.DateTimeFormat(lang==='es'?'es-CO':'en-US',{timeZone:'America/Bogota',dateStyle:'medium',timeStyle:'short'}).format(new Date(ms));
const norm=s=>String(s??'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const keyOf=i=>norm(i.c||i.n);

function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),2800)}

/* ---------- Lectura de la planilla ---------- */
function toNum(v){
  if(typeof v==='number')return isFinite(v)?v:null;
  let s=String(v??'').replace(/[^\d.,-]/g,'');if(!s)return null;
  if(/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(s))s=s.replace(/\./g,'').replace(',','.');      // 12.500 / 12.500,50
  else if(/^\d{1,3}(,\d{3})+(\.\d+)?$/.test(s))s=s.replace(/,/g,'');                   // 12,500 / 12,500.50
  else s=s.replace(',','.');
  const x=parseFloat(s);return isFinite(x)?x:null;
}
function parseRows(rows){
  let h=-1;
  for(let i=0;i<Math.min(rows.length,40);i++){if(rows[i].some(c=>/precio|valor|pvp|price/.test(norm(c)))){h=i;break}}
  if(h<0)return[];
  const hd=rows[h].map(norm);
  const find=(re,ex)=>hd.findIndex(x=>re.test(x)&&!(ex&&ex.test(x)));
  let p=find(/precio.*venta|^venta|pvp|price/);
  if(p<0)p=find(/precio|valor/,/costo|compra/);
  if(p<0)p=find(/precio|valor/);
  const n=find(/producto|descripcion|nombre|articulo|item|product/);
  const c=find(/^cod|codigo|^ref|sku|plu|code/);
  const cat=find(/categoria|linea|grupo|familia|seccion|category/);
  const u=find(/unidad|presentacion|empaque|medida|unit/);
  const b=find(/negocio|sucursal|tienda|sede|punto de venta/);
  if(n<0||p<0)return[];
  const out=[];
  for(let i=h+1;i<rows.length;i++){
    const r=rows[i]||[];const name=String(r[n]??'').trim();const price=toNum(r[p]);
    if(!name||price==null)continue;
    out.push({c:c>=0?String(r[c]??'').trim():'',n:name,cat:cat>=0?String(r[cat]??'').trim():'',u:u>=0?String(r[u]??'').trim():'',p:price,biz:b>=0?String(r[b]??'').trim():''});
  }
  return out;
}
function parseWorkbook(wb){
  const sheets={},order=[];
  wb.SheetNames.forEach(sn=>{
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:''});
    const items=parseRows(rows);if(!items.length)return;
    items.forEach(i=>{const k=i.biz||sn.trim();delete i.biz;if(!sheets[k]){sheets[k]=[];order.push(k)}sheets[k].push(i)});
  });
  return{sheets,order};
}
function applyNew(parsed,source){
  if(!parsed.order.length){toast(t('errFile'));return}
  let total=0,anyChange=false;
  parsed.order.forEach(sn=>{
    const old=data?.sheets?.[sn];const map={};(old||[]).forEach(i=>map[keyOf(i)]=i);
    const same=old&&old.length===parsed.sheets[sn].length&&parsed.sheets[sn].every(i=>map[keyOf(i)]&&map[keyOf(i)].p===i.p);
    parsed.sheets[sn].forEach(i=>{
      total++;const o=map[keyOf(i)];
      if(same){if(o.prev!=null)i.prev=o.prev;if(o.isNew)i.isNew=true;return}   // misma planilla abierta otra vez: se conservan las marcas
      anyChange=true;
      if(o){if(o.p!==i.p)i.prev=o.p}else if(old)i.isNew=true;
    });
    if(!same)anyChange=true;
  });
  data={...parsed,file:source,loadedAt:Date.now()};
  LS.set('pl_data',data);
  if(!data.order.includes(st.sheet))st.sheet=data.order[0];
  st.q='';st.cat='';st.onlyChg=countChg(data.sheets[st.sheet])>0;
  render();toast(anyChange?t('okLoad').replace('{n}',total):t('okSame'));
}
function readFile(f){
  if(!window.XLSX){toast(t('libs'));return}
  const r=new FileReader();
  r.onload=e=>{try{applyNew(parseWorkbook(XLSX.read(e.target.result,{type:'array'})),f.name)}catch(err){console.error(err);toast(t('errFile'))}};
  r.readAsArrayBuffer(f);
}
function sheetUrl(u){const m=u.match(/docs\.google\.com\/spreadsheets\/d\/([^/]+)/);if(m&&!/\/pub|output=/.test(u))return`https://docs.google.com/spreadsheets/d/${m[1]}/export?format=xlsx`;return u}
async function refresh(silent){
  if(!cfg.url){if(!silent){toast(t('noUrl'));$('#file').click()}return}
  if(!navigator.onLine){if(!silent)toast(t('offline'));return}
  if(!window.XLSX){if(!silent)toast(t('libs'));return}
  try{
    const res=await fetch(sheetUrl(cfg.url),{cache:'no-store'});if(!res.ok)throw 0;
    applyNew(parseWorkbook(XLSX.read(await res.arrayBuffer(),{type:'array'})),'Google Drive');
  }catch(e){if(!silent)toast(t('errUrl'))}
}

/* ---------- Ejemplo ---------- */
function demo(){
  const base=[['101','Arroz Diana 500 g','Granos','Unidad',2900,2700],['102','Fríjol bola roja 500 g','Granos','Unidad',6800,6800],['103','Lenteja 500 g','Granos','Unidad',3900,3900],
   ['201','Aceite Premier 1.000 ml','Aceites','Botella',12500,11900],['202','Aceite Gourmet 900 ml','Aceites','Botella',15900,15900],
   ['301','Leche Proleche 900 ml','Lácteos','Bolsa',4300,4300],['302','Queso costeño libra','Lácteos','Libra',14000,13000],
   ['401','Ducales sabor a queso','Galletas','Taco',2600,2600],['402','Saltín Noel 5 tacos','Galletas','Paquete',7200,6900],['403','Galletas Muuu leche','Galletas','Paquete',5800,5800],
   ['501','Atún Van Camp’s lomitos 160 g','Enlatados','Lata',6900,7200],['502','Salchichas Zenú lata','Enlatados','Lata',5400,5400],
   ['601','Café Sello Rojo 250 g','Bebidas','Bolsa',11800,10900],['602','Chocolisto 200 g','Bebidas','Bolsa',6500,6500]];
  const mk=(adj,newOne)=>base.map(r=>({c:r[0],n:r[1],cat:r[2],u:r[3],p:Math.round(r[4]*adj/100)*100,prev:r[4]!==r[5]?Math.round(r[5]*adj/100)*100:undefined}))
    .concat(newOne?[{c:'701',n:'Panela Doña Pola 500 g',cat:'Granos',u:'Unidad',p:3600,isNew:true}]:[]);
  data={sheets:{'Negocio 1':mk(1,true),'Negocio 2':mk(1.06,false)},order:['Negocio 1','Negocio 2'],file:'ejemplo.xlsx',loadedAt:Date.now()};
  LS.set('pl_data',data);st.sheet='Negocio 1';st.onlyChg=false;render();
}

/* ---------- Pantalla ---------- */
const countChg=list=>(list||[]).filter(i=>i.prev!=null||i.isNew).length;
function itemTag(i){
  if(i.isNew)return`<span class="tag nw">${t('nw')}</span>`;
  if(i.prev!=null)return`<span class="tag ${i.p>i.prev?'up':'down'}">${i.p>i.prev?t('up'):t('down')}</span><span class="was">${t('before')} ${money(i.prev)}</span>`;
  return'';
}
function render(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-t]').forEach(el=>el.textContent=t(el.dataset.t));
  $('#langBtn').textContent=lang==='es'?'EN':'ES';
  $('#bizName').textContent=cfg.name||t('title');
  $('#refreshBtn').style.display=cfg.url?'':'none';
  $('#meta').textContent=data?`${t('loaded')} ${fmtDate(data.loadedAt)} · ${t('file')}: ${data.file}`:'';
  const app=$('#app');
  if(!data){
    app.innerHTML=`<main><section class="welcome"><h2>${t('wT')}</h2><p>${t('wP')}</p>
      <div class="steps"><div class="step"><i>1</i><span>${t('s1')}</span></div><div class="step"><i>2</i><span>${t('s2')}</span></div><div class="step"><i>3</i><span>${t('s3')}</span></div></div>
      <button class="btn btn-ghost" id="demoBtn">${t('demo')}</button></section>
      <footer>${t('made')} <a href="https://vibraspositivashm.com" target="_blank" rel="noopener">Vibras Positivas HM</a></footer></main>`;
    $('#demoBtn').onclick=demo;renderCart();return;
  }
  const list=data.sheets[st.sheet]||[];
  const cats=[...new Set(list.map(i=>i.cat).filter(Boolean))];
  const nChg=countChg(list),nNew=list.filter(i=>i.isNew).length;
  const q=norm(st.q);
  let rows=list.filter(i=>(!st.cat||i.cat===st.cat)&&(!st.onlyChg||i.prev!=null||i.isNew)&&(!q||norm(i.n+' '+i.c+' '+i.cat).includes(q)));
  const groups={};rows.forEach(i=>{(groups[i.cat||'—']??=[]).push(i)});
  let html='';
  if(data.order.length>1)html+=`<div class="tabs">${data.order.map(s=>`<button class="tab ${s===st.sheet?'on':''}" data-sheet="${esc(s)}">${esc(s)}</button>`).join('')}</div>`;
  html+=`<div class="stats"><div class="stat"><b>${list.length}</b><span>${t('products')}</span></div>
    <div class="stat ${nChg-nNew?'hot':''}"><b>${nChg-nNew}</b><span>${t('changed')}</span></div><div class="stat"><b>${nNew}</b><span>${t('newp')}</span></div></div>
    <div class="searchbar"><input class="search" id="q" type="search" placeholder="${t('search')}" value="${esc(st.q)}" autocomplete="off">
    <div class="chips"><button class="chip ${!st.cat&&!st.onlyChg?'on':''}" data-cat="">${t('all')}</button>
    ${nChg?`<button class="chip alert ${st.onlyChg?'on':''}" data-chg="1">${t('changes')} (${nChg})</button>`:''}
    ${cats.map(c=>`<button class="chip ${st.cat===c?'on':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}</div></div><main id="list">`;
  html+=listHtml(groups,rows);
  html+=`<footer>${t('made')} <a href="https://vibraspositivashm.com" target="_blank" rel="noopener">Vibras Positivas HM</a></footer></main>`;
  app.innerHTML=html;
  app.querySelectorAll('[data-sheet]').forEach(b=>b.onclick=()=>{st.sheet=b.dataset.sheet;st.cat='';st.onlyChg=false;render()});
  app.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{st.cat=b.dataset.cat;st.onlyChg=false;render()});
  app.querySelectorAll('[data-chg]').forEach(b=>b.onclick=()=>{st.onlyChg=!st.onlyChg;st.cat='';render()});
  const qi=$('#q');qi.oninput=()=>{st.q=qi.value;updateList()};
  bindItems();renderCart();
}
function listHtml(groups,rows){
  if(!rows.length)return`<div class="empty">${t('noRes')}</div>`;
  return Object.keys(groups).map(g=>`${g!=='—'?`<div class="cat">${esc(g)}</div>`:''}${groups[g].map((i,ix)=>{
    const k=st.sheet+'|'+keyOf(i);
    return`<button class="item ${i.isNew?'new':i.prev!=null?'chg':''} ${cart[k]?'incart':''}" data-k="${esc(keyOf(i))}" style="animation-delay:${Math.min(ix,12)*25}ms">
      <div><div class="nm">${esc(i.n)}</div><div class="sub">${[i.c&&t('code')+' '+esc(i.c),esc(i.u),cart[k]?`${t('qty')}: ${cart[k]}`:''].filter(Boolean).join(' · ')}</div></div>
      <div class="pr"><b>${money(i.p)}</b>${itemTag(i)}</div></button>`}).join('')}`).join('');
}
function updateList(){
  const list=data.sheets[st.sheet]||[];const q=norm(st.q);
  const rows=list.filter(i=>(!st.cat||i.cat===st.cat)&&(!st.onlyChg||i.prev!=null||i.isNew)&&(!q||norm(i.n+' '+i.c+' '+i.cat).includes(q)));
  const groups={};rows.forEach(i=>{(groups[i.cat||'—']??=[]).push(i)});
  const foot=$('#list footer').outerHTML;$('#list').innerHTML=listHtml(groups,rows)+foot;bindItems();
}
function bindItems(){document.querySelectorAll('.item').forEach(b=>b.onclick=()=>openItem(b.dataset.k))}
const findItem=(sheet,k)=>(data?.sheets?.[sheet]||[]).find(i=>keyOf(i)===k);

/* ---------- Cotización ---------- */
function openItem(k){
  const i=findItem(st.sheet,k);if(!i)return;const ck=st.sheet+'|'+k;let n=cart[ck]||1;
  sheet(`<h3>${esc(i.n)}</h3><div class="sub">${[i.c&&t('code')+' '+esc(i.c),esc(i.u),esc(st.sheet)].filter(Boolean).join(' · ')}</div>
   <div style="font-size:30px;font-weight:800">${money(i.p)}</div>${itemTag(i)}
   <div class="qty"><button id="m">−</button><input id="n" inputmode="numeric" value="${n}"><button id="p">+</button></div>
   <div class="qtotal"><span>${t('total')}</span><span id="lt">${money(i.p*n)}</span></div>
   <div class="row">${cart[ck]?`<button class="btn btn-soft" id="rm">${t('remove')}</button>`:`<button class="btn btn-soft" id="cl">${t('close')}</button>`}<button class="btn btn-dark" id="ad">${t('add')}</button></div>`);
  const inp=$('#n'),upd=()=>{n=Math.max(1,parseInt(inp.value)||1);inp.value=n;$('#lt').textContent=money(i.p*n)};
  $('#m').onclick=()=>{inp.value=n-1;upd()};$('#p').onclick=()=>{inp.value=n+1;upd()};inp.oninput=upd;
  $('#ad').onclick=()=>{cart[ck]=n;saveCart();closeSheet();render()};
  if($('#rm'))$('#rm').onclick=()=>{delete cart[ck];saveCart();closeSheet();render()};
  if($('#cl'))$('#cl').onclick=closeSheet;
}
function cartLines(){return Object.entries(cart).map(([ck,q])=>{const[s,...r]=ck.split('|');const i=findItem(s,r.join('|'));return i?{ck,s,i,q}:null}).filter(Boolean)}
function saveCart(){LS.set('pl_cart',cart)}
function renderCart(){
  const L=cartLines();const bar=$('#cartbar');
  if(!L.length){bar.classList.remove('show');return}
  const tot=L.reduce((a,l)=>a+l.i.p*l.q,0);
  $('#cartCount').textContent=`${L.length} ${t('items')}`;$('#cartTotal').textContent=money(tot);bar.classList.add('show');
}
function openQuote(){
  const L=cartLines();const tot=L.reduce((a,l)=>a+l.i.p*l.q,0);
  sheet(`<h3>${t('quote')}</h3><div class="sub">${esc(cfg.name||t('title'))} · ${fmtDate(Date.now())}</div>
   ${L.map(l=>`<div class="qline"><div><b>${esc(l.i.n)}</b><div class="sub">${money(l.i.p)}${data.order.length>1?' · '+esc(l.s):''}</div></div>
     <div class="q"><button data-d="${esc(l.ck)}">−</button><b>${l.q}</b><button data-u="${esc(l.ck)}">+</button><span style="min-width:78px;text-align:right">${money(l.i.p*l.q)}</span></div></div>`).join('')}
   <div class="qtotal"><span>${t('total')}</span><span>${money(tot)}</span></div>
   <div class="row"><button class="btn btn-soft" id="qc">${t('empty')}</button><button class="btn btn-wa" id="qs">${t('send')}</button></div>
   <button class="btn btn-soft" style="width:100%;margin-top:8px" id="qx">${t('close')}</button>`);
  document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const k=b.dataset.d;cart[k]--;if(cart[k]<1)delete cart[k];saveCart();render();cartLines().length?openQuote():closeSheet()});
  document.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{cart[b.dataset.u]++;saveCart();render();openQuote()});
  $('#qc').onclick=()=>{cart={};saveCart();closeSheet();render()};
  $('#qx').onclick=closeSheet;
  $('#qs').onclick=()=>{
    const txt=`${t('waHello')}\n*${cfg.name||t('title')}* — ${fmtDate(Date.now())}\n\n`+L.map(l=>`• ${l.q} x ${l.i.n} — ${money(l.i.p*l.q)}`).join('\n')+`\n\n*${t('total')}: ${money(tot)}*`;
    const num=(cfg.wa||'').replace(/\D/g,'');
    window.open(`https://wa.me/${num}?text=${encodeURIComponent(txt)}`,'_blank');
  };
}

/* ---------- Ajustes ---------- */
function openSettings(){
  sheet(`<h3>${t('settings')}</h3><div class="sub">&nbsp;</div>
   <div class="field"><label>${t('bizName')}</label><input id="fn" value="${esc(cfg.name)}" placeholder="${t('title')}"></div>
   <div class="field"><label>${t('ownerWa')}</label><input id="fw" inputmode="tel" value="${esc(cfg.wa)}" placeholder="573001234567"><div class="hint">${t('waHint')}</div></div>
   <div class="field"><label>${t('url')}</label><input id="fu" inputmode="url" value="${esc(cfg.url)}" placeholder="https://docs.google.com/spreadsheets/…"><div class="hint">${t('urlHint')}</div></div>
   <div class="row"><button class="btn btn-soft" id="sx">${t('close')}</button><button class="btn btn-dark" id="ss">${t('save')}</button></div>
   <button class="danger" id="se">${t('erase')}</button>`);
  $('#sx').onclick=closeSheet;
  $('#ss').onclick=()=>{cfg={name:$('#fn').value.trim(),wa:$('#fw').value.trim(),url:$('#fu').value.trim()};LS.set('pl_cfg',cfg);closeSheet();render();toast(t('saved'));if(cfg.url)refresh(true)};
  $('#se').onclick=()=>{if(confirm(t('eraseQ'))){LS.del('pl_data');LS.del('pl_cart');data=null;cart={};closeSheet();render()}};
}

/* ---------- Hoja inferior ---------- */
function sheet(html){$('#sheet').innerHTML=html;$('#ov').classList.add('show')}
function closeSheet(){$('#ov').classList.remove('show')}
$('#ov').onclick=e=>{if(e.target.id==='ov')closeSheet()};

$('#openBtn').onclick=()=>$('#file').click();
$('#file').onchange=e=>{const f=e.target.files[0];if(f)readFile(f);e.target.value=''};
$('#refreshBtn').onclick=()=>refresh(false);
$('#setBtn').onclick=openSettings;
$('#cartOpen').onclick=openQuote;
$('#langBtn').onclick=()=>{lang=lang==='es'?'en':'es';LS.set('pl_lang',lang);render()};
window.addEventListener('offline',()=>toast(t('offline')));

render();
window.addEventListener('load',()=>{if(cfg.url)refresh(true)});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
